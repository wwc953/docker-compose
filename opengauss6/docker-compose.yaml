version: '3.1'
services:
  opengauss:
    image: enmotech/opengauss:6.0.0
    container_name: opengauss
    privileged: true
    ports:
      - "15432:5432"
    environment:
      - TZ=Asia/Shanghai
#      - GS_USERNAME=root #默认用户 gaussdb
      - GS_PASSWORD=Root@123  # OpenGauss密码：大写字母+小写字母+数字+特殊字符，长度>=8
      - GS_DB=test # 默认数据库 postgres
    shm_size: '2gb'
