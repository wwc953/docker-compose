version: '3'
services:
  mysql-master:
    image: mysql:5.7.31
    container_name: mysql-master
    command: [ "--server-id=1","--character-set-server=utf8", "--collation-server=utf8_general_ci","--log_bin=mysql-bin","--binlog-format=ROW","--binlog_row_image=FULL","--gtid_mode=ON", "--enforce_gtid_consistency=ON" ]
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: Abcd123!
      MYSQL_DATABASE: udf_test_db
      TZ: Asia/Shanghai
    volumes:
      - ./master-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  # ---------- 从库：只读 ----------
  mysql-replica:
    image: mysql:5.7.31
    container_name: mysql-replica
    depends_on:
      mysql-master:
        condition: service_healthy
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Abcd123!
      MYSQL_DATABASE: udf_test_db
      TZ: Asia/Shanghai
    command:
      - --server-id=2
      - --relay-log=mysql-relay-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - ./replica-init:/docker-entrypoint-initdb.d:ro